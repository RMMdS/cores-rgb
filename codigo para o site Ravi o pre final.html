<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo RGB — 16,7 milhões</title>
  <style>
    :root{--bg:#0f1115;--card:#151822;--card2:#1b2030;--ink:#e7e9ee;--muted:#9aa3b2;--accent:#4f8cff;--ok:#2ecc71;--bad:#ff5c5c;--grid-gap:10px;--radius:16px}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;background:linear-gradient(180deg,#0b0d12,#141926);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,"Noto Sans",sans-serif}
    header{position:sticky;top:0;z-index:10;background:rgba(13,16,23,.7);backdrop-filter:saturate(140%) blur(10px);border-bottom:1px solid #222843}
    .wrap{max-width:1200px;margin:0 auto;padding:18px}h1{margin:0 0 8px;font-size:22px;letter-spacing:.2px}.sub{color:var(--muted);font-size:13px}
    .searchbar{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}.chip{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid #222843;border-radius:999px;padding:10px 12px}.chip input{all:unset;color:var(--ink)}.chip .num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:700;background:var(--accent);color:#fff}.chip button{all:unset;background:var(--accent);padding:6px 10px;border-radius:999px;cursor:pointer}.chip button:hover{filter:brightness(1.1)}
    .layout{display:grid;grid-template-columns:280px 1fr;gap:16px;margin-top:16px}.panel{background:var(--card);border:1px solid #222843;border-radius:var(--radius);padding:14px}.panel h3{margin:0 0 10px;font-size:14px;color:var(--muted)}
    .saved-list{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto}.saved-item{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid #242a46;padding:8px;border-radius:12px;cursor:pointer}.sw{width:22px;height:22px;border-radius:6px;border:1px solid rgba(255,255,255,.15)}.saved-item span{font-size:12px}.saved-item small{color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:var(--grid-gap)}.tile{border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:var(--card2);cursor:pointer}.tile .swatch{width:100%;height:74px}.tile .meta{padding:8px;font-size:12px;display:flex;justify-content:space-between;gap:6px}.name{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hex{font-family:ui-monospace,monospace;color:#c8d0ff}
    .pager{display:flex;align-items:center;gap:8px;margin-top:12px}.pager button{background:var(--card2);border:1px solid #242a46;color:var(--ink);padding:8px 10px;border-radius:10px;cursor:pointer}.pager input{background:var(--card2);border:1px solid #242a46;color:var(--ink);padding:8px 10px;border-radius:10px;width:100px}.muted{color:var(--muted)}
    .drawer{position:fixed;top:0;right:-420px;width:420px;height:100%;background:linear-gradient(180deg,#0f1422,#141b2e);border-left:1px solid #222843;transition:right .25s ease;z-index:20;display:flex;flex-direction:column}.drawer.open{right:0}.drawer header{padding:16px;border-bottom:1px solid #222843;background:transparent}.drawer .content{padding:16px;display:flex;flex-direction:column;gap:12px}.big{width:100%;height:160px;border-radius:14px;border:1px solid rgba(255,255,255,.15)}.row{display:flex;align-items:center;gap:8px}.row input{flex:1;background:var(--card2);border:1px solid #242a46;color:var(--ink);padding:10px 12px;border-radius:10px}.row code{background:#0f1422;border:1px solid #242a46;padding:8px 10px;border-radius:10px}.primary{background:var(--accent);border:0;color:#fff;padding:10px 12px;border-radius:10px;cursor:pointer}.ghost{background:transparent;border:1px solid #2a3356;color:var(--ink);padding:10px 12px;border-radius:10px;cursor:pointer}.close{position:absolute;top:10px;right:10px;background:transparent;border:0;color:var(--muted);font-size:22px;cursor:pointer}
    a{color:var(--accent);text-decoration:none}.kbd{font-family:ui-monospace,monospace;background:#0f1422;border:1px solid #242a46;border-bottom-width:3px;padding:2px 6px;border-radius:6px}
    @media(max-width:920px){.layout{grid-template-columns:1fr}.drawer{width:100%}}
  </style>
</head>
<body>
<header><div class="wrap"><h1>Catálogo RGB — seu dicionário de cores pessoal</h1><div class="sub">Clique numa cor para nomear. Duplo clique numa cor nomeada para remover. Pesquise <span class="kbd">1</span> nome ou <span class="kbd">2</span> hex.</div><div class="searchbar"><form id="searchByName" class="chip" autocomplete="off"><span class="num">1</span><input id="nameQuery" placeholder="Pesquisar pelo nome…"/><button type="submit">Buscar</button></form><form id="searchByHex" class="chip" autocomplete="off"><span class="num">2</span><input id="hexQuery" placeholder="#RRGGBB"/><button type="submit">Ir</button></form></div></div></header>
<main class="wrap"><div class="layout"><aside class="panel"><h3>Seus nomes salvos</h3><div class="saved-list" id="savedList"></div><div class="muted">Clique para abrir / Duplo clique para remover. Dados locais.</div></aside><section><div class="panel"><div class="row" style="justify-content:space-between;gap:12px;margin-bottom:10px"><div class="muted">Mostrando cores</div><div class="row"><label class="muted" for="pageSize" style="font-size:12px">Por página:</label><select id="pageSize" style="background:var(--card2);border:1px solid #242a46;color:var(--ink);padding:8px;border-radius:10px"><option>256</option><option selected>512</option><option>1024</option><option>2048</option></select></div></div><div class="grid" id="grid"></div><div class="pager"><button id="prevBtn">◀</button><button id="nextBtn">▶</button><input id="gotoPage" type="number" min="1" step="1" placeholder="nº"/><button id="gotoBtn">Ir</button><span class="muted" id="pageInfo"></span></div></div></section></div></main>
<div class="drawer" id="drawer"><button class="close" id="closeDrawer">×</button><header class="wrap"><strong id="drawerTitle">Cor</strong></header><div class="content"><div id="bigSwatch" class="big"></div><div class="row"><code id="hexDisplay">#000000</code><button class="ghost" id="copyHex">Copiar</button></div><label class="muted" for="nameInput">Nome</label><div class="row"><input id="nameInput"/><button class="primary" id="saveName">Salvar</button></div><div class="muted" id="status"></div></div></div>
<script>
const TOTAL=16777216,$=s=>document.querySelector(s),pad6=n=>n.toString(16).padStart(6,'0').toUpperCase(),lum=hex=>{const r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);return 0.2126*r+0.7152*g+0.0722*b},setSw=(el,h)=>{el.style.backgroundColor='#'+h;const L=lum(h);el.style.border=L<40?'1px solid rgba(255,255,255,.35)':L>220?'1px solid rgba(0,0,0,.35)':'1px solid rgba(255,255,255,.15)'};const LS='rgbbook.hex2name.v1';const load=()=>JSON.parse(localStorage.getItem(LS)||'{}'),save=m=>localStorage.setItem(LS,JSON.stringify(m));let state={page:1,pageSize:512,hex2name:load(),currentHex:null};
function renderGrid(){const g=$('#grid');g.innerHTML='';const s=(state.page-1)*state.pageSize,e=Math.min(s+state.pageSize,TOTAL);for(let i=s;i<e;i++){const h=pad6(i),n=state.hex2name[h]||'';const t=document.createElement('div');t.className='tile';t.innerHTML=`<div class="swatch"></div><div class="meta"><span class="name">${n||'&nbsp;'}</span><span class="hex">#${h}</span></div>`;setSw(t.querySelector('.swatch'),h);t.addEventListener('click',()=>openDrawer(h));g.appendChild(t);}updatePagerInfo()}
function totalPages(){return Math.ceil(TOTAL/state.pageSize)}
function updatePagerInfo(){$('#pageInfo').textContent=`Página ${state.page}/${totalPages()}`}
function openDrawer(h){state.currentHex=h;$('#drawerTitle').textContent='Cor #'+h;setSw($('#bigSwatch'),h);$('#hexDisplay').textContent='#'+h;$('#nameInput').value=state.hex2name[h]||'';$('#status').textContent='';$('#drawer').classList.add('open')}
function closeDrawer(){$('#drawer').classList.remove('open')}
function saveCurrentName(){const h=state.currentHex;if(!h)return;const n=($('#nameInput').value||'').trim();if(!n){delete state.hex2name[h];$('#status').textContent='Nome removido.'}else{const ex=Object.entries(state.hex2name).find(([hx,nm])=>nm.toLowerCase()===n.toLowerCase()&&hx!==h);if(ex){$('#status').textContent='⚠ Já existe em #'+ex[0];return}state.hex2name[h]=n;$('#status').textContent='Nome salvo ✔'}save(state.hex2name);renderGrid();renderSavedList()}
function renderSavedList(f=''){const b=$('#savedList');b.innerHTML='';const e=Object.entries(state.hex2name).sort((a,b)=>a[1].localeCompare(b[1],'pt',{sensitivity:'base'}));for(const[hex,n]of e){const it=document.createElement('div');it.className='saved-item';it.innerHTML=`<div class="sw" style="background:#${hex}"></div><span><strong>${n}</strong><br><small>#${hex}</small></span>`;it.addEventListener('click',()=>openDrawer(hex));it.addEventListener('dblclick',()=>{ if (confirm(`Remover o nome "${n}" da cor #${hex}?`)) { delete state.hex2name[hex]; save(state.hex2name); renderGrid(); renderSavedList(); } });b.appendChild(it)}if(!b.children.length)b.innerHTML='<div class="muted">Nenhum nome.</div>'}
function normalizeHexInput(s){if(!s)return null;s=s.trim().toUpperCase();if(s.startsWith('#'))s=s.slice(1);return /^[0-9A-F]{6}$/.test(s)?s:null}
function goToHex(h){const i=parseInt(h,16);state.page=Math.floor(i/state.pageSize)+1;renderGrid();openDrawer(h)}
$('#prevBtn').addEventListener('click',()=>{state.page=Math.max(1,state.page-1);renderGrid()});$('#nextBtn').addEventListener('click',()=>{state.page=Math.min(totalPages(),state.page+1);renderGrid()});$('#gotoBtn').addEventListener('click',()=>{let p=parseInt($('#gotoPage').value,10);if(!isFinite(p))return;state.page=Math.max(1,Math.min(totalPages(),p));renderGrid()});$('#pageSize').addEventListener('change',e=>{state.pageSize=parseInt(e.target.value,10);state.page=1;renderGrid()});$('#closeDrawer').addEventListener('click',closeDrawer);$('#saveName').addEventListener('click',saveCurrentName);$('#copyHex').addEventListener('click',()=>{navigator.clipboard.writeText('#'+state.currentHex)});$('#searchByName').addEventListener('submit',e=>{e.preventDefault();renderSavedList($('#nameQuery').value||'')});$('#searchByHex').addEventListener('submit',e=>{e.preventDefault();const h=normalizeHexInput($('#hexQuery').value);if(!h){alert('Hex inválido');return}goToHex(h)});
function boot(){renderSavedList();renderGrid()}boot();
</script>
</body></html>
